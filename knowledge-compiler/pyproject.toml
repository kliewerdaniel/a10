[project]
name = "knowledge-compiler"
version = "0.1.0"
description = "Build-time static artifact compiler for the Sovereign Knowledge Portal (extends tie/ concepts)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.2",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
knowledge-compiler = "run:cli"

[tool.setuptools]
packages = ["compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
